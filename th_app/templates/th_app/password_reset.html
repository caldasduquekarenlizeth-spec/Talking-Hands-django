{% extends 'th_app/base.html' %}
{% block title %}Recuperar Contraseña | Talking Hands{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
    <div class="auth-header">
        <h2 class="auth-title">¿Olvidaste tu contraseña?</h2>
        <p class="auth-subtitle">Ingresa tu correo registrado y te enviaremos un enlace para restablecerla.</p>
    </div>

    <form method="POST" class="auth-form">
        {% csrf_token %}
        <div class="form-group">
        <label for="id_email">Correo electrónico</label>
        <input type="email" name="email" id="id_email" class="form-input" placeholder="nombre@ejemplo.com" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Enviar enlace</button>
    </form>

    <div class="auth-footer">
        <a href="{% url 'login' %}" class="auth-link">← Volver al inicio de sesión</a>
    </div>
    </div>
</section>
{% endblock %}
