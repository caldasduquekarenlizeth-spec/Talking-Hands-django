{% extends "th_app/base.html" %}

{% block title %}Iniciar Sesión | Talking Hands{% endblock %}

{% block content %}
<section class="auth-section">
<div class="auth-card">
    <div class="auth-header">
        <div class="auth-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <line x1="19" y1="8" x2="19" y2="14"></line>
                <line x1="22" y1="11" x2="16" y2="11"></line>
            </svg>
        </div>
        <h2 class="auth-title">Iniciar Sesión</h2>
    </div>

    <form method="POST" class="auth-form">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="id_username">Usuario:</label>
            <input 
            type="text" 
            name="username"
            placeholder="Ej. carlos_m" 
            id="id_username" 
            required 
            class="form-input"
        >
        </div>

        <div class="form-group">
                    <label for="id_password">Contraseña:</label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <input 
                            type="password" 
                            id="id_password" 
                            name="password" 
                            placeholder="••••••••" 
                            required 
                            class="form-input"
                            style="padding-right: 2.75rem; width: 100%;"
                        >
                        <button 
                            type="button" 
                            onclick="togglePassword('id_password', 'icon-eye-open', 'icon-eye-closed')" 
                            aria-label="Mostrar u ocultar contraseña"
                            style="position: absolute; right: 0.75rem; background: none; border: none; cursor: pointer; color: #64748b; display: flex; align-items: center; padding: 0;"
                        >
                            <svg id="icon-eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg id="icon-eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>
            
                <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
            </form>
        
            <div class="auth-footer">
                <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
                    ¿No tienes cuenta? <a href="{% url 'registro' %}" style="color: var(--primary); font-weight: bold;">Regístrate aquí</a>
                </p>
            </div>
        </div>
        </section>
        
        <script>
        function togglePassword(inputId, openIconId, closedIconId) {
            const input = document.getElementById(inputId);
            const eyeOpen = document.getElementById(openIconId);
            const eyeClosed = document.getElementById(closedIconId);
        
            if (input.type === 'password') {
                input.type = 'text';
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'block';
            } else {
                input.type = 'password';
                eyeOpen.style.display = 'block';
                eyeClosed.style.display = 'none';
            }
        }
        </script>
        {% endblock %}
